plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword'),
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace = 'com.example.jiongtu'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = 'com.example.jiongtu'
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is required. Configure ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or android/key.properties.')
        }
        if (!file(releaseSigning.storeFile).isFile()) {
            throw new GradleException('Release keystore file does not exist.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(validateReleaseSigning)
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}
