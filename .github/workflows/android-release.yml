name: Android Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies and generate code
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APKs with the fixed release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jiongtu-release.p12
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Remove temporary signing key
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jiongtu-release.p12
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify APK signing certificates
        run: |
          export APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          bash .github/scripts/verify-apk-signatures.sh android/release-signing-cert.sha256 \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Prepare release assets
        run: |
          mkdir -p release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release/jiongtu-${abi}.apk"
          done
          cp android/release-signing-cert.sha256 release/SIGNING_CERT_SHA256
          (cd release && sha256sum ./*.apk > SHA256SUMS)
          python3 .github/scripts/create-update-manifest.py \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --tag "android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Save build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/android-release-notes.md"
          cat > "$notes" <<EOF
          自动构建自 master 提交 ${GITHUB_SHA}。

          - ARM64 手机：下载 jiongtu-arm64-v8a.apk。
          - 32 位 ARM 设备：下载 jiongtu-armeabi-v7a.apk。
          - x86_64 设备或模拟器：下载 jiongtu-x86_64.apk。
          - 最低支持 Android 7.0；SHA256SUMS 用于校验下载文件。
          - 应用内可在“设置 → 检查更新”中下载并安装后续版本。

          本版本使用固定发布签名。安装过固定签名版本后，后续新构建可覆盖升级。
          从此前开发签名版本切换时，仍需先卸载旧版一次（会清除本地数据）。
          SIGNING_CERT_SHA256 记录签名证书指纹，每次发布前都会校验所有 APK。

          [构建记录](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          # Avoid marking a build that is already behind master as latest.
          latest=false
          master_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          if [[ "$master_sha" == "$GITHUB_SHA" ]]; then
            latest=true
          fi

          gh release create "$tag" release/*.apk release/SHA256SUMS release/SIGNING_CERT_SHA256 release/update.json \
            --target "$GITHUB_SHA" \
            --title "Android build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$notes" \
            --latest="$latest"
